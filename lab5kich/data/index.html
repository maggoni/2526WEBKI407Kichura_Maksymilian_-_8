<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Obsidian Core // Kichura</title>
    <style>
        :root { --gold: #d4af37; --bg: #030303; --panel: #0a0a0a; --text: #f0f0f0; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .frame { border: 1px solid var(--gold); padding: 50px; background: var(--panel); box-shadow: 0 0 50px rgba(212,175,55,0.1); text-align: center; }
        h1 { letter-spacing: 10px; text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--gold); padding-bottom: 15px; }
        .op { margin-top: 30px; font-weight: bold; color: var(--gold); opacity: 0.6; }
    </style>
</head>
<body>
    <div class="frame">
        <h1>SECURE_ACCESS</h1>
        <p>Encryption: TLS 1.2 Active</p>
        <p>Storage: LittleFS Verified</p>
        <div class="op">OPERATOR: MAKSYMILIAN KICHURA</div>
    </div>
</body>
</html>
